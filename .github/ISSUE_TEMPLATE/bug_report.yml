name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Eazy Backup version
      placeholder: 1.0.0+26.3
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Upload `logs/latest.log` to https://mclo.gs and paste the link.
